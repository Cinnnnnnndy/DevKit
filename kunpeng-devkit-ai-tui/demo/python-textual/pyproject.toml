[project]
name = "kunpeng-devkit-ai-tui"
version = "0.1.0"
description = "Kunpeng DevKit AI native Textual workspace prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
devkitai = "devkitai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["devkitai.py", "devkitai.tcss"]

