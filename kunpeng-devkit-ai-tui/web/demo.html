<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunpeng DevKit AI · Demo 故事线</title>
<style>
:root{
  --bg:#0b0b0b; --app:#101010; --elev:#141414;
  --s1:#161616; --s2:#1c1c1c; --s3:#262626; --s4:#313131;
  --fg:#e8e8e8; --fg2:#a4a4a4; --fg3:#777; --fg4:#555;
  --bd1:#242424; --bd2:#2d2d2d; --bd3:#3b3b3b;
  --pri:#0077ff; --pri-h:#3d98ff; --acc:#7c8db8;
  --ok:#04d793; --warn:#ffaa3b; --dgr:#ff4b7b;
  --o8:#773303;--o7:#A44604;--o6:#D15905;--o5:#F96A06;--o4:#FA8838;--o3:#FBAB74;
  --v8:#3F0675;--v6:#6E0ACD;--v4:#9B3CF6;--v3:#B977F9;
  --g8:#4D7209;--g6:#86C70F;--g4:#B3F141;--g3:#CAF57A;
  --a8:#713F12;--a6:#CA8A04;--a4:#F4CB22;
  --sel:#18293c;
  /* Kunpeng 身份色：仅用于标识（splash 字标 / 顶栏迷你标）。
     不做 UI 强调色、不做语义色、不做数据色 —— TUI 里红已被"失败 / Critical"占用。*/
  --kp:#ED1C24; --kp2:#c9c9c9;
  --mono:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace;
  --sans:'Inter','PingFang SC','Noto Sans SC',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.scan{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.3;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.013) 0 1px,transparent 1px 3px)}

/* ═ head ═ */
.head{max-width:1240px;margin:0 auto;padding:26px 24px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg{width:24px;height:24px;border-radius:0;background:var(--pri);display:grid;
  grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.lg i{background:#fff;border-radius:1px}
.lg i:nth-child(1){opacity:.95}.lg i:nth-child(2){opacity:.6}
.lg i:nth-child(3){opacity:.6}.lg i:nth-child(4){opacity:.32}
.head b{font-size:15px}
.head .c{font-family:var(--mono);font-size:11px;color:var(--fg3);background:var(--s2);
  border:1px solid var(--bd1);border-radius:2px;padding:2px 8px}
.head .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--fg);background:var(--s2);
  border:1px solid var(--bd2);border-radius:2px;padding:7px 14px;cursor:pointer;
  transition:all .1s cubic-bezier(.4,0,.2,1)}
.btn:hover{background:var(--s3);border-color:var(--bd3)}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* ═ act rail ═ */
.rail{max-width:1240px;margin:0 auto;padding:0 24px 14px;display:flex;gap:5px;flex-wrap:wrap}
.act{flex:1;min-width:88px;background:var(--s1);border:1px solid var(--bd1);border-radius:2px;
  padding:8px 10px;cursor:pointer;transition:all .12s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.act:hover{background:var(--s2);border-color:var(--bd3)}
.act.on{background:var(--sel);border-color:var(--pri)}
.act.done::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ok);opacity:.5}
.act .n{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--fg4);line-height:1}
.act.on .n{color:var(--pri-h);text-shadow:0 0 10px rgba(0,119,255,.5)}
.act.done .n{color:var(--ok)}
.act .t{font-size:11px;color:var(--fg3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.on .t{color:var(--fg)}

/* ═ terminal ═ */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 40px}
.term{background:var(--app);border:1px solid var(--bd2);border-radius:5px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.55);position:relative}
.tbar{height:34px;background:var(--s2);border-bottom:1px solid var(--bd1);display:flex;align-items:center;
  padding:0 12px;gap:7px}
.tbar .d{width:9px;height:9px;border-radius:1px}
.tbar .t{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--fg3)}
.tbar .rt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--fg4)}
.screen{position:relative;min-height:498px;font-family:var(--mono);font-size:12.5px;line-height:1.55}
#pf{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sc{position:relative;z-index:1;height:100%}

/* app chrome */
.appbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--s2);
  border-bottom:1px solid var(--bd1);font-size:11.5px}
.appbar .k{color:var(--pri-h);font-weight:600}
.appbar .rr{margin-left:auto;color:var(--fg3);font-size:11px}
.body{display:grid;grid-template-columns:212px 1fr;min-height:396px}
/* ══ Chrome 层：真 UI 组件（PTO design system）══ */
.dockhd{display:flex;align-items:center;gap:9px;height:44px;flex:none;
  padding:0 12px;border-bottom:1px solid var(--bd1);background:var(--s2)}
.dockhd{white-space:nowrap;overflow:hidden}
.dockhd .blogo{font-size:9.5px;letter-spacing:.10em}
.dockhd .blogo span{padding:0 5px}
.dockhd .kpi{width:22px;height:22px;margin-right:6px}
.tabs .tbr .v{font-family:var(--mono);font-size:10.5px;color:var(--fg4);letter-spacing:.08em;margin-right:3px}
.tabs .tbr{margin-left:auto;display:flex;gap:7px;align-items:center;padding-bottom:3px}
.dock{background:var(--app);border-right:1px solid var(--bd1);padding:0 0 6px;font-size:11.5px;
  display:flex;flex-direction:column;overflow:hidden}
.dsec{padding:8px 0 6px}
.dsec .h{display:flex;align-items:center;gap:6px;padding:3px 12px 5px;
  font-size:9px;letter-spacing:.16em;color:var(--fg4)}
.dsec .h .car{font-size:7px;opacity:.7}
.dsec .h .cnt{margin-left:auto;background:var(--s3);border:1px solid var(--bd1);border-radius:2px;
  padding:0 6px;font-size:8.5px;color:var(--fg3);letter-spacing:0;line-height:1.5}
.dsep{height:1px;background:var(--bd1);margin:2px 10px}

/* 列表项 = 组件，不是文本行 */
.item{display:flex;align-items:center;gap:7px;padding:3.5px 10px;margin:0 5px;border-radius:0;
  position:relative;color:var(--fg2);min-width:0}
.item:hover{background:var(--s2)}
.item.sel{background:var(--sel);color:var(--fg)}
.item.sel::before{content:'';position:absolute;left:-3px;top:4px;bottom:4px;width:2px;
  background:var(--pri-h);border-radius:0}
.item .ico{width:10px;text-align:center;flex:none;font-size:10px}
.item .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:9px;color:var(--fg4);flex:none;letter-spacing:0}
.item .pill{font-size:8.5px;padding:0 5px;border-radius:2px;background:var(--s3);
  border:1px solid var(--bd1);color:var(--fg3);flex:none;line-height:1.6}
.item .risk{height:4px;border-radius:0;flex:none}
.item .gut{color:var(--fg4);opacity:.45;white-space:pre;flex:none;font-size:11px;letter-spacing:-1px}

/* Tab bar = 真 tab */
.tabs{display:flex;align-items:flex-end;gap:2px;background:var(--s2);
  border-bottom:1px solid var(--bd1);padding:0 12px 0;height:44px}
.tab{display:flex;align-items:center;gap:6px;padding:3.5px 11px;font-size:11px;color:var(--fg3);
  border-radius:0;border:1px solid transparent;border-bottom:none;position:relative;
  top:1px;white-space:nowrap}
.tab.on{background:var(--app);border-color:var(--bd1);color:var(--fg)}
.tab.on::after{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:2px;
  background:var(--pri);border-radius:0}
.tab .d{width:5px;height:5px;border-radius:1px;flex:none}
.tab .x{color:var(--fg4);font-size:9px;opacity:.6}
.tab.add{color:var(--fg4);padding:3.5px 8px}

/* Header chip */
.chip2{display:inline-flex;align-items:center;gap:5px;background:var(--s3);border:1px solid var(--bd1);
  border-radius:2px;padding:1px 8px;font-size:10px;color:var(--fg2);line-height:1.6}
.chip2 .d{width:5px;height:5px;border-radius:1px}

/* Canvas 面板头 = 组件 */
.cvh2{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.14em;color:var(--fg4);
  padding-bottom:6px;border-bottom:1px solid var(--bd1);margin-bottom:9px}
.cvh2 .r{margin-left:auto;letter-spacing:0}

/* 结构化列表（Plan / Evidence / 下一步）= 组件 */
.slist{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:flex-start;gap:9px;padding:4px 8px;border-radius:0;
  border:1px solid transparent;min-width:0}
.srow:hover{background:var(--s2)}
.srow.on{background:var(--sel);border-color:rgba(0,119,255,.3)}
.srow .n{font-size:10px;color:var(--fg4);flex:none;width:13px;text-align:right;padding-top:1px}
.srow .bd{flex:1;min-width:0}
.srow .t1{color:var(--fg);font-size:11.5px}
.srow .t2{color:var(--fg4);font-size:10px;margin-top:1px}
.srow .rt{flex:none;font-size:11px;color:var(--fg4);padding-top:1px;min-width:14px;text-align:right}
.srow .tag{font-size:8.5px;padding:0 6px;border-radius:2px;background:var(--s3);
  border:1px solid var(--bd1);color:var(--acc);line-height:1.7}

/* 底栏分段 */
.stat{border-top:1px solid var(--bd1);background:var(--s2);padding:0;font-size:10px;color:var(--fg4);
  display:flex;align-items:stretch}
.stat .sg{padding:4px 11px;border-right:1px solid var(--bd1);display:flex;align-items:center;gap:5px}
.stat .sg.acc{background:rgba(0,119,255,.12);color:var(--pri-h)}
.stat .sp{flex:1}
.stat .sg:last-child{border-right:none}

/* token 级 diff 高亮（源自 OpenCode 实拍）*/
.dl{display:flex;gap:10px;padding:1px 0;font-size:12px}
.dl .ln{color:var(--fg4);font-size:10.5px;min-width:34px;text-align:right;flex:none;padding-top:1px}
.dl .sg{flex:none;width:8px;text-align:center}
.dl.del{background:rgba(255,75,123,.06)}
.dl.add{background:rgba(4,215,147,.06)}
.tk{padding:0 3px;border-radius:0}
.tk.d{background:#5a2330;color:#ff9db0}
.tk.a{background:#12463a;color:#5ee7b7}

/* 底部 keybar（源自 SysWatch / kanban 实拍）*/
.keybar{border-top:1px solid var(--bd1);background:var(--app);padding:4px 12px;
  display:flex;gap:11px;font-size:10px;color:var(--fg3);flex-wrap:wrap;align-items:center}
.keybar b{background:var(--s4);color:var(--fg);font-weight:500;padding:0 5px;border-radius:2px;
  margin-right:3px;font-family:var(--mono);font-size:9.5px;line-height:1.7;display:inline-block}

/* 状态徽章：反色 chip + 色轨（源自 Specify CLI 实拍）*/
.sb{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;
  padding:0 5px;border-radius:1px;flex:none;line-height:1.75}
.sb.ok{background:var(--ok);color:#04231a}
.sb.er{background:var(--dgr);color:#2b0710}
.sb.wn{background:var(--warn);color:#2b1a03}
.sb.in{background:var(--s4);color:var(--fg)}
.rl{display:flex;align-items:baseline;gap:9px;padding:2.5px 0 2.5px 9px;
  border-left:2px solid var(--bd2);margin:1px 0;font-size:11.5px}
.rl.ok{border-color:var(--ok)} .rl.er{border-color:var(--dgr)}
.rl.wn{border-color:var(--warn)} .rl.in{border-color:var(--bd3)}
.rl .tx{color:var(--fg2);flex:1;min-width:0}

/* Insights 条（源自 SysWatch 实拍）*/
.ins{border-top:1px solid var(--bd1);background:var(--s1);padding:5px 12px;font-size:10.5px}
.ins .hd{color:var(--fg4);font-size:9px;letter-spacing:.14em;margin-bottom:3px}
.insr{display:flex;align-items:center;gap:8px;padding:1.5px 0}
.insr .sev{font-size:8.5px;padding:0 5px;border-radius:2px;font-weight:600;flex:none}
.insr .sev.c{background:rgba(255,75,123,.16);color:var(--dgr)}
.insr .sev.w{background:rgba(255,170,59,.16);color:var(--warn)}
.insr .tx{flex:1;color:var(--fg2)}
.insr .jp{color:var(--pri-h);flex:none;font-size:10px}

/* 滚动条指示 */
.sbar{position:absolute;right:2px;top:8px;bottom:8px;width:2px;background:var(--s3);border-radius:0}
.sbar i{position:absolute;left:0;width:2px;background:var(--bd3);border-radius:0}
.main{display:flex;flex-direction:column;min-width:0}
.canvases{display:grid;flex:1;min-height:0}
.cv{padding:10px 13px;overflow:auto;border-right:1px solid var(--bd1);min-width:0}
.cv:last-child{border-right:none}
.cvh{font-size:10px;letter-spacing:.12em;color:var(--fg4);margin-bottom:7px;
  display:flex;align-items:center;gap:8px}
.cvh::after{content:'';flex:1;height:1px;background:var(--bd1)}
.console{border-top:1px solid var(--bd2);background:var(--s1);padding:8px 13px;min-height:92px;font-size:11.5px}
.inp{border-top:1px solid var(--bd1);background:var(--s2);padding:9px 13px;font-size:12.5px;flex:none}
.inp .box{display:flex;align-items:center;gap:9px;background:var(--app);
  border:1px solid var(--bd2);border-radius:2px;padding:6px 12px;
  box-shadow:0 0 0 2px rgba(0,119,255,.09)}
.inp .box .k{margin-left:auto;flex:none;font-size:10.5px;color:var(--fg4);letter-spacing:.04em}
.inp .box .k b{background:var(--s4);color:var(--fg2);font-weight:500;padding:0 5px;
  border-radius:2px;margin-right:4px;font-size:10px}
.stat{border-top:1px solid var(--bd1);background:var(--s2);padding:4px 13px;font-size:10.5px;color:var(--fg4);
  display:flex;gap:14px;align-items:center}
.stat .rr{margin-left:auto}

/* text helpers */
.cm{color:var(--fg4)} .d2{color:var(--fg2)} .pr{color:var(--pri-h)} .br{color:var(--pri)}
.ok{color:var(--ok)} .wn{color:var(--warn)} .er{color:var(--dgr)} .ac{color:var(--acc)}
.b{font-weight:700} .selbg{background:var(--sel)}
.mut{color:var(--fg3)}
pre{font-family:var(--mono);font-size:11.5px;line-height:1.42;white-space:pre;margin:5px 0}
.cur{display:inline-block;width:7px;height:14px;background:var(--pri-h);vertical-align:-2px;
  animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.spin{color:var(--pri-h)}
.ovl{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(11,11,11,.62);backdrop-filter:blur(1px)}
.ovlbox{background:var(--s1);border:1px solid var(--bd3);border-radius:4px;padding:14px 18px;
  min-width:430px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.ovlbox .t{font-size:12px;color:var(--pri-h);font-weight:600;margin-bottom:3px}
.ovlbox .w{font-size:11px;color:var(--fg3);margin-bottom:10px}
.fld{display:flex;gap:10px;padding:3px 0;font-size:12px}
.fld .l{width:78px;color:var(--fg3)}
.fld .v{color:var(--fg)}
.keys{margin-top:11px;font-size:11px;color:var(--fg3)}
.keys b{color:var(--pri-h)}

/* boot splash */
/* 启动页：一切都落在字符格上，不用模糊、不用自由定位 —— 终端做不到的效果一律不用 */
.boot{position:absolute;inset:0;overflow:hidden;z-index:2}
.boot pre{font-size:11px;line-height:1.05;text-shadow:none;margin:0}
/* 背景：字符网格半调点阵（GitHub 式密度渐变，但每个"点"都是一个字符） */
pre.bgf{position:absolute;inset:0;z-index:0;overflow:hidden;color:transparent;
  background:linear-gradient(148deg,#2b333d 0%,#26302f 26%,#232a2a 48%,#252d33 72%,#2c343e 100%);
  -webkit-background-clip:text;background-clip:text;
  white-space:pre;font-family:var(--mono);pointer-events:none;user-select:none;letter-spacing:0}
pre.bgw2{color:transparent;background:linear-gradient(148deg,#49566a 0%,#3f5a54 34%,#3d5560 66%,#4a5670 100%);
  -webkit-background-clip:text;background-clip:text}
pre.bgw1{color:transparent;background:linear-gradient(148deg,#93a6c2 0%,#84b0a2 34%,#7fa8bc 66%,#9aa4cc 100%);
  -webkit-background-clip:text;background-clip:text}
.bootin{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0}
.boot .lock{gap:26px;align-items:center}
.boot .wm{line-height:1.02;letter-spacing:0;
  text-shadow:0 0 12px rgba(255,255,255,.34), 0 0 34px rgba(172,196,228,.22), 0 0 70px rgba(120,150,200,.13)}
.boot .kpm{text-shadow:0 0 14px rgba(237,28,36,.28), 0 0 36px rgba(237,28,36,.14)}
.boot .kpm{line-height:.86}
.brule{color:#333;margin:16px 0 12px !important;letter-spacing:0}
.bchips{display:flex;gap:7px;margin:18px 0 22px}
.blog{line-height:1.62;letter-spacing:0}
/* 启动页输入框 = 真组件：描边 + 焦点环 + 提示位 + 右侧快捷键槽 */
.binput{display:flex;align-items:center;gap:10px;margin-top:22px;width:820px;
  background:var(--s1);border:1px solid var(--bd2);border-radius:2px;padding:9px 14px;
  box-shadow:0 0 0 3px rgba(0,119,255,.10);font-family:var(--mono);font-size:15px}
.binput .p{flex:none;font-size:15px}
.binput .ph{color:var(--fg3);flex:none}
.binput .cur{flex:none;margin-right:2px}
.binput .hint{margin-left:auto;flex:none;font-size:11.5px;color:var(--fg4);letter-spacing:.04em}
.binput .hint b{background:var(--s4);color:var(--fg2);font-weight:500;padding:1px 6px;
  border-radius:2px;margin-right:5px;font-size:11px}
.bsug{display:flex;align-items:center;gap:7px;margin-top:12px;font-family:var(--mono);font-size:12.5px}
.bsug .sl{color:var(--fg4);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-right:3px}
.bsug .sg{border:1px solid var(--bd1);border-radius:2px;padding:2px 10px;color:var(--fg3)}
.bsug .sg:first-of-type{border-color:var(--bd3);color:var(--fg2)}

/* achievement */
.ach{display:inline-flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--bd2);
  border-radius:2px;padding:3px 11px;margin:3px 5px 3px 0;font-size:11px;color:var(--fg2)}
.ach i{width:8px;height:8px;background:var(--ok);border-radius:1px;box-shadow:0 0 8px rgba(4,215,147,.7)}

/* caption */
.cap{max-width:1240px;margin:14px auto 0;padding:0 24px;display:grid;
  grid-template-columns:1fr 300px;gap:12px}
.capbox{background:var(--s1);border:1px solid var(--bd1);border-radius:3px;padding:14px 16px}
.capbox .e{font-size:10px;letter-spacing:.16em;color:var(--pri-h);margin-bottom:5px}
.capbox h3{font-size:15px;font-weight:600;margin-bottom:6px}
.capbox p{font-size:13px;color:var(--fg2);margin:6px 0}
.capbox .wow{color:var(--ok);font-weight:600}
.pats{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pat{font-family:var(--mono);font-size:10px;color:var(--fg3);background:var(--s2);
  border:1px solid var(--bd1);border-radius:2px;padding:2px 8px}
.pat.hi{color:var(--pri-h);border-color:rgba(0,119,255,.35)}
.prog{height:3px;background:var(--s3);border-radius:0;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s cubic-bezier(.4,0,.2,1)}

/* ══════════ AwesomeTUI 手法层（在 PTO token 之上）══════════
   四条：文字底色（反色分段）· 字体（全大写 + 字距）· 颜色层级（整行同色）· 方形（直角） */

/* ① 文字底色：分段反色标识块 —— ›|DEVKIT|AI ▌|.tui */
.blogo{display:inline-flex;align-items:stretch;font-family:var(--mono);font-size:10px;
  font-weight:700;letter-spacing:.14em;line-height:1.9;user-select:none}
.blogo span{padding:0 6px}
.blogo .g0{background:var(--pri);color:#04122b}
.blogo .g1{background:var(--s4);color:var(--fg);letter-spacing:.18em}
.blogo .g2{background:var(--s2);color:var(--fg2);letter-spacing:.18em;border:1px solid var(--bd2)}
.blogo .g3{background:var(--fg3);width:5px;padding:0;animation:bl 1.1s steps(1) infinite}
.blogo .g4{background:none;color:var(--fg4);font-weight:500;letter-spacing:.1em;padding-left:7px}

/* ② 字体：区块标题一律全大写 + 重字距，靠字距而非字号建立层级 */
.dsec .h{display:flex;align-items:baseline;gap:6px;padding:5px 12px 5px;
  font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.22em;
  color:var(--fg4);text-transform:uppercase}
.dsec .h .hash{color:var(--fg4);font-weight:700;letter-spacing:0}
.dsec .h .cnt{margin-left:auto;background:none;border:none;padding:0;
  font-size:8.5px;color:var(--fg4);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.dsec .h .car{display:none}

/* ③ 颜色层级：选中行整行同色（前缀 + 标签 + 计数一起变），而不是只染标签 */
.item{font-family:var(--mono);letter-spacing:.01em}
.item .idx{color:var(--fg4);flex:none;font-size:10px;width:9px;opacity:.75}
.item:hover{background:var(--s2)}
.item:hover .idx{color:var(--fg3)}
.item.sel{background:var(--sel)}
.item.sel,.item.sel .lb,.item.sel .idx,.item.sel .meta,.item.sel .ico{color:var(--pri-h)}
.item.sel .meta{opacity:.8}
.item.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--pri);border-radius:0}
.item.sel .pill{border-color:rgba(0,119,255,.42);color:var(--pri-h);background:rgba(0,119,255,.10)}
.item .meta{font-variant-numeric:tabular-nums}

/* ④ 面板标题：终端提示符字形 + 全大写，取代此前的裸字距标题 */
.cvh2{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9px;
  font-weight:700;letter-spacing:.2em;color:var(--fg2);text-transform:uppercase;
  padding-bottom:6px;border-bottom:1px solid var(--bd1);margin-bottom:9px}
.cvh2 .pmt{color:var(--fg4);letter-spacing:0;font-size:10px}
.cvh2 .r{margin-left:auto;letter-spacing:.04em;color:var(--fg4);font-weight:500;text-transform:none}

/* ⑤ 排序/筛选按钮组：方形描边，激活态=描边+文字上色（不填充） */
.sortg{display:inline-flex;gap:4px;margin-left:auto}
.sbtn{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4);
  background:none;border:1px solid var(--bd2);border-radius:2px;padding:1px 6px;line-height:1.7}
.sbtn.on{color:var(--fg);border-color:var(--fg3)}
.sbtn .a{font-size:8px;opacity:.8}

/* ⑥ 标签流：#TAG + 计数，方形描边 */
.tagf{display:flex;flex-wrap:wrap;gap:4px}
.tagf .tg{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:9.5px;
  border:1px solid var(--bd2);border-radius:2px;padding:0 6px;color:var(--fg2);line-height:1.8}
.tagf .tg s{text-decoration:none;color:var(--fg4);font-size:8.5px}
.tagf .tg.on{border-color:var(--fg3);color:var(--fg)}

/* ⑦ 反色小节标签（用于 Console / Insights 头） */
.ivl{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;background:var(--s4);color:var(--fg);
  padding:0 6px;border-radius:1px;line-height:1.8}
.ivl.p{background:var(--pri);color:#04122b}
.ivl.o{background:var(--ok);color:#04231a}
.ivl.w{background:var(--warn);color:#2b1a03}
.ivl.e{background:var(--dgr);color:#2b0710}

/* ⑧ 状态栏：首段做成反色块，与其余分段拉开层级 */
.stat .sg{font-family:var(--mono);letter-spacing:.06em}
.stat .sg.acc{background:var(--s4);color:var(--fg);font-weight:700;letter-spacing:.12em}
.stat .sg.acc .cm{color:var(--fg3)}

/* ⑨ Tab：方角 + 全大写 + 激活态顶部实心色条 */
.tab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tab.add{letter-spacing:0}

/* ⑨.4 NEW 标 —— 借自鲲鹏 DevKit 社区站：红只出现在标识与"新增"上 */
.new{display:inline-block;font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.1em;background:var(--kp);color:#fff;padding:0 4px;border-radius:2px;
  line-height:1.7;flex:none;margin-left:4px}

/* ⑨.5 Kunpeng 标识：半块像素还原（每字符格 = 2 垂直像素） */
.kpm{font-family:var(--mono);white-space:pre;line-height:.86;letter-spacing:0;font-size:12px;flex:none}
.kpm i{font-style:normal}
.kpi{width:26px;height:26px;object-fit:contain;flex:none;image-rendering:auto}
/* 标识两个渲染档位：T5 光栅（Kitty/Sixel/iTerm2 可用时，顶栏用）
   T1 半块像素（纯字符降级，splash 用——同时也是我们要的像素调性）*/
.lock{display:flex;align-items:center;gap:22px}
.lock .wm2{display:flex;flex-direction:column;align-items:flex-start}
.lock .kn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.44em;
  color:var(--fg2);margin-bottom:6px}
.blogo .kpi{margin-right:7px;align-self:center}
.blogo .new{align-self:center;margin-left:6px}

/* ⑩ 抖动像素字标（两色分段 + 抖动衰减带） */
.wm .w1{color:#f4f4f4}
.wm .w2{color:#f4f4f4}
.dith{font-family:var(--mono);font-size:11px;line-height:.92;margin-top:2px;white-space:pre}
.dith .d1{color:#6e6e6e}.dith .d2{color:#4a4a4a}.dith .d3{color:#333}
.keybar b{border-radius:2px;letter-spacing:.06em}

/* ══════════ 1920 × 1080 标准画布 ══════════
   所有尺寸按 1920×1080 实际像素设计；整台舞台再等比缩放塞进当前视口，
   所以任意屏幕上看到的都是同一张 1080p 设计稿，不是响应式重排。 */
html,body{height:100%;overflow:hidden;background:#050505}
#stage{position:absolute;left:0;top:0;width:2562px;height:1420px;
  transform-origin:top left;background:var(--bg);
  display:flex;flex-direction:column;padding:26px 30px 22px;gap:14px}
#stage .head{max-width:none;margin:0;padding:0;gap:14px;flex:none}
#stage .rail{max-width:none;margin:0;padding:0;gap:6px;flex:none;height:74px}
.stagebody{flex:1;min-height:0;display:grid;grid-template-columns:2060px 424px;gap:18px}
.wrap{max-width:none;margin:0;padding:0;min-width:0;display:flex;align-items:center}

/* ══ 无品牌笔记本外壳 —— 屏幕内仍是真实的 1920×1080 ══ */
.laptop{width:2060px;flex:none;display:flex;flex-direction:column;align-items:center}
.lid{position:relative;padding:30px 30px 56px;border-radius:20px 20px 4px 4px;
  background:linear-gradient(#3b4046,#22252a 55%,#16181b);border:1px solid #52585f;
  box-shadow:0 34px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14)}
.lid .cam{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;background:#090a0b;box-shadow:inset 0 0 0 1px #5b616a}
.hinge{width:1760px;height:14px;background:linear-gradient(#0d0f11,#2c3036);
  box-shadow:inset 1px 0 0 #52585f,inset -1px 0 0 #52585f}
.base{position:relative;width:2060px;height:32px;border-radius:0 0 16px 16px;
  background:linear-gradient(#41464d 0 2px,#2b2f35 2px,#15171a);
  box-shadow:0 28px 64px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16)}
.base::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:240px;height:10px;border-radius:0 0 9px 9px;background:#0b0d0f}

/* 终端窗口 = 1920×1080 实际像素 —— 这一台"屏幕"就是 1080p */
.term{width:1920px;height:1080px;flex:none;display:flex;flex-direction:column;border-radius:4px;
  box-shadow:0 0 0 1px #0a0b0c,inset 0 0 60px rgba(0,0,0,.5)}
.tbar{height:38px;flex:none}
.screen{flex:1;min-height:0;font-size:16px;line-height:1.5}
.sc{display:flex;flex-direction:column;height:100%}
.body{flex:1;min-height:0;grid-template-columns:300px 1fr}
.main{flex:1;min-height:0}
.canvases{flex:1;min-height:0}
.boot{inset:0}

/* 右栏串讲卡片竖排 */
#stage .cap{max-width:none;margin:0;padding:0;display:flex;flex-direction:column;
  gap:14px;min-height:0}
#stage .capbox{overflow:auto;flex:none}

/* 1080p 下的字号档 —— 终端单元格变大，不是把小终端放大 */
.appbar{font-size:13px;padding:8px 15px}
.blogo{font-size:11.5px}
.kpi{width:30px;height:30px}
.dock{font-size:13px}

.dsec .h .cnt{font-size:10px}

.item .idx{font-size:11px;width:12px}
.item .meta{font-size:10.5px}
.item .pill{font-size:10px}
.tabs{padding:0 14px;height:50px}
.dockhd{height:50px;padding:0 14px}
.dockhd .blogo{font-size:10.5px}
.dockhd .kpi{width:25px;height:25px}
.dockhd .v{font-size:11px}
.tab{font-size:12px;padding:5px 14px}
.cv{padding:14px 18px}
.cvh2{font-size:10.5px;padding-bottom:8px;margin-bottom:12px}
.cvh2 .pmt{font-size:12px}
.sbtn{font-size:10.5px;padding:2px 8px}
.tagf .tg{font-size:11px;padding:1px 8px}
pre{font-size:14px;line-height:1.45}
.srow{padding:6px 10px}
.srow .t1{font-size:13.5px}
.srow .t2{font-size:12px}
.srow .n{font-size:12px;width:17px}
.srow .tag{font-size:10px}
.dl{font-size:14px}
.dl .ln{font-size:12.5px;min-width:40px}
.console{padding:11px 18px;min-height:118px;font-size:13.5px}
.inp{padding:10px 18px;font-size:15px}
.keybar{padding:6px 15px;font-size:12px;gap:14px}
.keybar b{font-size:11.5px;padding:1px 6px}
.stat{font-size:12px}
.stat .sg{padding:6px 14px}
.ivl{font-size:10px}
.sb{font-size:10px;padding:1px 6px}
.rl{font-size:13.5px;padding:3.5px 0 3.5px 11px}
.ovlbox{min-width:520px;padding:18px 24px}
.ovlbox .t{font-size:14px} .ovlbox .w{font-size:13px}
.fld{font-size:14px} .fld .l{width:96px}
.keys{font-size:13px}
.chip2{font-size:11.5px;padding:2px 10px}
.new{font-size:9.5px}
.kpm{font-size:14px}
.boot pre{font-size:14px}
pre.bgf{font-size:14px;line-height:1.5}
.blog,.bhint,.brule{font-size:14px}
.boot .wm{font-size:14px}
.lock .kn{font-size:13px}
.wm{font-size:13px}
.dith{font-size:13px}

/* 头部与幕轨在 1080p 下的档位 */
#stage .head b{font-size:18px}

#stage .btn{font-size:13.5px;padding:8px 16px}

function stopFlow(){ if(FLOW.raf) cancelAnimationFrame(FLOW.raf); FLOW.raf=0; }
function startFlow(){
  stopFlow();
  const w1=E('bgw1'), w2=E('bgw2'); if(!w1||!w2||!FLOW.d) return;
  let last=0;
  const step=(ts)=>{
    FLOW.raf=requestAnimationFrame(step);
    if(ts-last<30) return;               // ~33fps：明灭要利落
    last=ts;
    const L=WAVE2(FLOW.d,FLOW.cols,FLOW.rows,FLOW.elig);
    w1.textContent=L[0]; w2.textContent=L[1];
  };
  FLOW.raf=requestAnimationFrame(step);
}
function fillBG(){
  const el=E('bgf'); if(!el){stopFlow();return;}
  const sc=E('sc');

  p.style.cssText=`position:absolute;visibility:hidden;white-space:pre;font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight}`;
  p.textContent='M'.repeat(100); sc.appendChild(p);
  const r=p.getBoundingClientRect(); const cw=r.width/100, ch=r.height; p.remove();
  const box=el.getBoundingClientRect();
  const cols=Math.ceil(box.width/cw)+1, rows=Math.ceil(box.height/ch)+1;
  FLOW.d=FIELD(cols,rows); FLOW.cols=cols; FLOW.rows=rows;
  const eg=[]; for(let i=0;i<cols*rows;i++) if(FLOW.d[i]>0.30) eg.push(i);

  el.textContent=RENDER(FLOW.d,cols,rows);
  startFlow();
}

/* ══ 5 行块字体：启动页字标必须落在字符格上，不能是自由排版的图形 ══ */
const F5={
 A:['.###.','#...#','#####','#...#','#...#'], D:['####.','#...#','#...#','#...#','####.'],
 E:['#####','#....','####.','#....','#####'], G:['.####','#....','#..##','#...#','.####'],
 I:['#####','..#..','..#..','..#..','#####'], K:['#...#','#..#.','###..','#..#.','#...#'],
 N:['#...#','##..#','#.#.#','#..##','#...#'], P:['####.','#...#','####.','#....','#....'],
 T:['#####','..#..','..#..','..#..','..#..'], U:['#...#','#...#','#...#','#...#','.###.'],
 V:['#...#','#...#','#...#','.#.#.','..#..']
};
const BR=(w)=>[0,1,2,3,4].map(r=>[...w].map(c=>F5[c][r]).join('.')
  .replace(/#/g,'█').replace(/\./g,' '));
function WORDMARK(){
  const a=BR('KUNPENG'), b=BR('DEVKIT'), c=BR('AI');
  return [0,1,2,3,4].map(r=>
    `<span class="w2">${a[r]}</span>   <span class="w1">${b[r]}   ${c[r]}</span>`).join('\n');
}

/* ══ 字符网格背景场：GitHub 式半调点阵，但每个点都是一个字符 ══
   用确定性哈希而不是随机数，避免每次重绘都在抖 */
const GLY=[' ',' ',' ',' ',' ',' ','·','·','·','-','+','+'];
const H2=(x,y)=>{let h=(x*374761393+y*668265263)>>>0;h=(h^(h>>13))*1274126177>>>0;return((h>>>8)&65535)/65535;};
/* 值噪声：低频团块 —— 让字符场像一张地图，而不是一圈同心环 */
function VN(x,y,s){
  const gx=x/s, gy=y/s, x0=Math.floor(gx), y0=Math.floor(gy), fx=gx-x0, fy=gy-y0;
  const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
  return H2(x0,y0)*(1-u)*(1-v)+H2(x0+1,y0)*u*(1-v)+H2(x0,y0+1)*(1-u)*v+H2(x0+1,y0+1)*u*v;
}
/* 密度图：算一次，缓存。光每帧只在这张图上跑，所以光只会点亮"本来就有点"的格子 */
function FIELD(cols,rows){
  const cx=cols*.5, cy=rows*.48, d=new Float32Array(cols*rows);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const dx=(x-cx)/(cols*.5), dy=(y-cy)/(rows*.5);
    const r=Math.sqrt(dx*dx*1.02+dy*dy*0.96);
    let h=(x*374761393+y*668265263)>>>0; h=(h^(h>>13))*1274126177>>>0;
    const n=((h>>>8)&1023)/1023;
    const organic=VN(x,y,6.5)*.88 + VN(x,y,2.4)*.44 - .56;
    d[y*cols+x]=Math.max(0,Math.min(.999,(r-.60)*1.50 + organic*.58 + n*.16));
  }
  return d;
}
const RENDER=(d,cols,rows)=>{
  let o='';
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++) o+=GLY[Math.floor(d[y*cols+x]*GLY.length)];
    if(y<rows-1) o+='\n';
  }
  return o;
};
/* 四周的细碎光点：几十个小光点在点阵的外圈随机点亮又熄灭，各自寿命不同、
   位置不规则、每一颗只占 1–5 格。快速明灭 + 随机重生 = 灵动而不抢戏。
   每帧改写的仍然只是字符本身 —— 终端每帧重绘单元格就是这么干的。 */
const WGLY=[' ','·','·','-','+','*','#'];
const SPARKS=[];
function seedSparks(n){
  SPARKS.length=0;
  for(let i=0;i<n;i++) SPARKS.push({t:0,ttl:1,i:-1,big:0});
}
function WAVE2(d,cols,rows,elig){
  const amp=new Float32Array(cols*rows);
  const put=(x,y,v)=>{ if(x<0||y<0||x>=cols||y>=rows) return;
    const j=y*cols+x; if(v>amp[j]) amp[j]=v; };
  for(let k=0;k<SPARKS.length;k++){
    const sp=SPARKS[k];
    sp.t++;
    if(sp.t>=sp.ttl||sp.i<0){                       // 熄灭 → 换个位置重生
      sp.t=0;
      sp.ttl=7+((Math.random()*22)|0);              // 0.3–1.2s，快
      sp.i=elig[(Math.random()*elig.length)|0];
      sp.big=Math.random()<0.34?1:0;                // 三成是"带一圈晕"的稍大点
    }
    const g=Math.sin(Math.PI*sp.t/sp.ttl);          // 淡入淡出
    if(g<=0.02) continue;
    const x=sp.i%cols, y=(sp.i/cols)|0;
    put(x,y,g);
    if(sp.big){ put(x-1,y,g*.52); put(x+1,y,g*.52); put(x,y-1,g*.44); put(x,y+1,g*.44); }
  }
  const L1=[],L2=[];
  for(let y=0;y<rows;y++){
    let a='',c='';
    for(let x=0;x<cols;x++){
      const i=y*cols+x, f=amp[i];
      if(f<=0){a+=' ';c+=' ';continue;}
      const v=f*(0.80+0.28*d[i]);
      a += (v<.56)?' ':WGLY[Math.min(6,((v-.56)/.44*7)|0)];   // 芯
      c += (v<.14)?' ':WGLY[Math.min(6,((v-.14)/.46*7)|0)];   // 晕
    }
    L1.push(a);L2.push(c);
  }
  return [L1.join('\n'),L2.join('\n')];
}

/* ══════ 运行时 ══════ */
let cur=0, playing=true, timer=null, typeTimer=null;

function buildRail(){

}
function paint(){
  const a=ACTS[cur];

    el.classList.toggle('on',i===cur); el.classList.toggle('done',i<cur);});

  E('ct').textContent=a.title;

  E('cw').textContent=a.wow;

  requestAnimationFrame(()=>{measureGrid();fillBG();});
  E('tbt').textContent = cur===0 ? 'user@localhost — devkitai' : 'user@localhost — devkitai · migrate nginx';
  PF.enabled = !!a.particles;
  clearTimeout(typeTimer);
  if(a.typing){
    let k=0;
    const tick=()=>{ E('sc').innerHTML=a.render(a.typing.slice(0,k));
      if(k<a.typing.length){k++;typeTimer=setTimeout(tick,52);} };
    tick();
  } else { E('sc').innerHTML=a.render(); }
}
function go(i){cur=(i+ACTS.length)%ACTS.length;paint();}
function next(){go(cur+1)} function prev(){go(cur-1)}
function play(){playing=true;E('play').textContent='❚❚ 暂停';E('play').classList.add('on');
  clearInterval(timer);timer=setInterval(next,6200);}
function pause(){playing=false;E('play').textContent='▶ 自动播放';E('play').classList.remove('on');
  clearInterval(timer);}
E('next').onclick=()=>{next();pause()};
E('prev').onclick=()=>{prev();pause()};
E('play').onclick=()=>playing?pause():play();
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){next();pause();e.preventDefault();}
  if(e.key==='ArrowLeft'){prev();pause();e.preventDefault();}
  if(e.key===' '){playing?pause():play();e.preventDefault();}
});

/* 粒子：仅开场幕启用，像素方点 + 字符雨 */
const PF=(function(){
  const c=E('pf'),x=c.getContext('2d');let W,H,dots=[],gl=[],on=false;
  const G='01<>{}[]/|-_=+*#⣿⣷⣠⡀▁▂▃▅▇█'.split('');
  function size(){const r=c.parentElement.getBoundingClientRect();
    W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio;
    c.style.width=r.width+'px';c.style.height=r.height+'px';}
  function init(){dots=[];gl=[];
    for(let i=0;i<Math.min(120,W*H/30000);i++)dots.push({x:Math.random()*W,y:Math.random()*H,
      s:(Math.random()*1.5+.6)*devicePixelRatio,v:Math.random()*.24+.06,
      a:Math.random()*.36+.06,c:Math.random()<.08?'0,119,255':'255,255,255'});
    for(let i=0;i<Math.min(26,W/(70*devicePixelRatio));i++)gl.push({x:Math.random()*W,y:Math.random()*H,
      g:G[Math.floor(Math.random()*G.length)],v:Math.random()*.3+.07,a:Math.random()*.15+.03,t:Math.random()*200});}
  function draw(){
    x.clearRect(0,0,W,H);
    if(on){
      for(const d of dots){d.y+=d.v*devicePixelRatio;if(d.y>H){d.y=-4;d.x=Math.random()*W;}
        x.fillStyle='rgba('+d.c+','+d.a+')';x.fillRect(Math.round(d.x),Math.round(d.y),d.s,d.s);}
      x.font='500 '+Math.round(11*devicePixelRatio)+'px ui-monospace,monospace';
      for(const g of gl){g.y+=g.v*devicePixelRatio;g.t++;
        if(g.t>240){g.g=G[Math.floor(Math.random()*G.length)];g.t=0;}
        if(g.y>H){g.y=-14;g.x=Math.random()*W;}
        x.fillStyle='rgba(170,170,170,'+g.a+')';x.fillText(g.g,g.x,g.y);}
    }
    requestAnimationFrame(draw);}
  size();init();draw();
  addEventListener('resize',()=>{size();init();},{passive:true});
  return {set enabled(v){on=v}};
})();
