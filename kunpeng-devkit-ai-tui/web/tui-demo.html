<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUI 设计 demo · Kunpeng DevKit AI</title>
<style>
/* ══════════════════════════════════════════════════════════
   TUI 设计 demo —— 两种风格上下排列，各占一屏。
   上下而非左右：每个 demo 都是 16:9 的宽画布，横排会被宽度压死，
   竖排每个能拿到接近满视口的尺寸，看得全。滚动切换。
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0b0b0b; --app:#101010; --s1:#161616; --s2:#1c1c1c;
  --fg:#e8e8e8; --fg2:#a4a4a4; --fg3:#777; --fg4:#555;
  --bd1:#242424; --bd2:#2d2d2d;
  --pri:#0077ff; --pri-h:#3d98ff; --accent:#4369ef; --accent-h:#6b8cf5;
  --mono:'JetBrains Mono','Fira Code','Consolas','Noto Sans Mono CJK SC',monospace;
  --sans:'Inter','Source Han Sans SC','PingFang SC','Noto Sans SC',-apple-system,sans-serif;
  --hd:57px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased}

/* ══ 吸顶头 ══ */
.head{position:sticky;top:0;z-index:20;height:var(--hd);display:flex;align-items:center;gap:12px;
  padding:0 22px;background:rgba(11,11,11,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd1)}
.head b{font-size:15px}
.head .c{font-family:var(--mono);font-size:11px;color:var(--fg3);background:var(--s2);
  border:1px solid var(--bd1);border-radius:3px;padding:2px 8px}
.head .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.jump{font-family:var(--mono);font-size:11.5px;color:var(--fg2);background:var(--s2);
  border:1px solid var(--bd2);border-radius:4px;padding:5px 11px;text-decoration:none}
.jump:hover{color:var(--fg);border-color:var(--fg4)}
.jump.a:hover{border-color:var(--pri)}
.jump.b:hover{border-color:var(--accent)}

/* ══ 每种风格占一屏 ══ */
.sec{min-height:calc(100vh - var(--hd));display:flex;flex-direction:column;
  padding:14px 20px 22px;scroll-margin-top:var(--hd)}
.sec + .sec{border-top:1px solid var(--bd1)}

.cap{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px}
.tagn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;padding:2.5px 9px;border-radius:3px}
.sec-a .tagn{color:#bcd7ff;background:rgba(0,119,255,.16);border:1px solid rgba(0,119,255,.45)}
.sec-b .tagn{color:#cfdcff;background:rgba(67,105,239,.16);border:1px solid rgba(67,105,239,.5)}
.cap h2{font-size:16px;font-weight:600}
.cap .sub{font-size:12.5px;color:var(--fg3)}
.cap .go{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--fg3);
  text-decoration:none;border:1px solid var(--bd2);border-radius:4px;padding:5px 11px;background:var(--s2)}
.cap .go:hover{color:var(--fg);border-color:var(--fg4)}

/* iframe 用绝对定位铺满，不用 height:100% ——
   .frame 的高度来自 flex，百分比高度在这种父级上不保证解析，会退回 iframe 默认的 150px。 */
.frame{position:relative;flex:1;min-height:520px;border:1px solid var(--bd2);border-radius:8px;
  overflow:hidden;background:#050505}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

/* 窄屏时不再强撑满屏，改用固定宽高比，避免被压扁 */
@media (max-width:900px){
  .sec{min-height:0}
  .frame{flex:none;aspect-ratio:16/10;min-height:0}
}
</style>
</head>
<body>

<div class="head">
  <b>TUI 设计 demo</b>
  <span class="c">Kunpeng DevKit AI</span>
  <span class="c">两种风格</span>
  <span class="r">
    <a class="jump a" href="#a">风格 A · 单栏工作台</a>
    <a class="jump b" href="#b">风格 B · 三栏分屏</a>
  </span>
</div>

<section class="sec sec-a" id="a">
  <div class="cap">
    <span class="tagn">风格 A</span>
    <h2>单栏工作台</h2>
    <span class="sub">十幕故事线 · 单二进制、零前置 · 可自动播放或键盘 ← → 切换</span>
    <a class="go" href="demo.html" target="_blank">整屏打开 ↗</a>
  </div>
  <div class="frame"><iframe src="demo.html" title="风格 A · 单栏工作台"></iframe></div>
</section>

<section class="sec sec-b" id="b">
  <div class="cap">
    <span class="tagn">风格 B</span>
    <h2>三栏分屏工作台</h2>
    <span class="sub">典型一屏 · 资源管理器 │ 源码 │ Agent 三个面板</span>
    <a class="go" href="demo-studio.html" target="_blank">整屏打开 ↗</a>
  </div>
  <div class="frame"><iframe src="demo-studio.html" title="风格 B · 三栏分屏工作台" loading="lazy"></iframe></div>
</section>

</body>
</html>
